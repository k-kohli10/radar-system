[project]
name = "radar-plugin-traces-elastic"
version = "0.1.0"
description = "RADAR traces query backend plugin for Elasticsearch: implements the radar-contracts TraceQuery protocol over the elasticsearch SDK, fetching one trace's spans by correlation_id. Portable — depends only on radar-contracts and the vendor SDK."
requires-python = ">=3.12"
dependencies = [
    "radar-contracts",
    "elasticsearch[async]==8.15.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_plugin_traces_elastic"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
