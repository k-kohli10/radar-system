[project]
name = "radar-plugin-knowledge-elastic"
version = "0.1.0"
description = "RADAR knowledge store plugin for Elasticsearch: implements the radar-contracts KnowledgeStore protocol over the elasticsearch SDK, with a dense_vector mapping for kNN and a text field for BM25. Portable — depends only on radar-contracts and the vendor SDK."
requires-python = ">=3.12"
dependencies = [
    "radar-contracts",
    "elasticsearch[async]==8.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_plugin_knowledge_elastic"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
