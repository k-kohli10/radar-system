[project]
name = "radar-plugin-metrics-prometheus"
version = "0.1.0"
description = "RADAR metrics backend plugin for Prometheus: implements the radar-contracts MetricsBackend protocol over the prometheus_client SDK. Portable — depends only on radar-contracts and the vendor SDK."
requires-python = ">=3.12"
dependencies = [
    "radar-contracts",
    "prometheus-client==0.21.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_plugin_metrics_prometheus"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
