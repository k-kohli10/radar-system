[project]
name = "radar-plugin-llm-openai"
version = "0.4.0"
description = "RADAR LLM provider plugin for OpenAI: implements the radar-contracts LLMProvider and EmbeddingProvider protocols over the openai SDK. Portable — depends only on radar-contracts and the vendor SDK."
requires-python = ">=3.12"
dependencies = [
    "radar-contracts",
    "openai==1.55.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_plugin_llm_openai"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
