[project]
name = "radar-plugin-llm-anthropic"
version = "0.4.0"
description = "RADAR LLM provider plugin for Anthropic: implements the radar-contracts LLMProvider protocol over the anthropic SDK. Portable — depends only on radar-contracts and the vendor SDK. Anthropic has no embedding model, so no EmbeddingProvider here."
requires-python = ">=3.12"
dependencies = [
    "radar-contracts",
    "anthropic==0.40.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_plugin_llm_anthropic"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
