[project]
name = "radar-plugin-llm-gemini"
version = "0.4.0"
description = "RADAR LLM provider plugin for Google Gemini: implements the radar-contracts LLMProvider and EmbeddingProvider protocols over the google-generativeai SDK. Portable — depends only on radar-contracts and the vendor SDK."
requires-python = ">=3.12"
dependencies = [
    "radar-contracts",
    "google-generativeai==0.8.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_plugin_llm_gemini"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]

# google-generativeai ships no py.typed; its surface is untyped.
[[tool.mypy.overrides]]
module = ["google.generativeai", "google.generativeai.*"]
ignore_missing_imports = true
