repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # k8s manifests under deploy/ are multi-document (--- separated).
        args: [--allow-multiple-documents]
        # Helm chart templates are Go templates, not valid YAML on their own.
        # Chart.yaml and values.yaml (no templating) are still checked.
        exclude: ^deploy/helm/.*/templates/.*\.ya?ml$
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Repo-wide strict mypy on every commit.
  #
  # `pass_filenames: false` + `always_run` are deliberate: this is a monorepo with
  # cross-package imports, so checking only the changed files would miss errors in
  # UNCHANGED files that depend on a changed interface. It must be the whole repo,
  # every time.
  #
  # A `local`/`system` hook (rather than mirrors-mypy) so it runs inside the uv
  # workspace venv, where the radar_* packages are actually importable.
  #
  # This is the structural guard for a blind spot that was behavioural: the
  # Makefile's `lint` target already ran `mypy .`, but a type error in a tests/
  # file survived five commits because narrower per-package mypy commands were run
  # by hand instead. A hook cannot be forgotten.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (repo-wide, strict)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true
