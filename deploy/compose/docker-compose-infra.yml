name: radar-infra

# Secrets are never hardcoded here. All ${VAR:?} values are read from .env
# at the repo root (generated by scripts/bootstrap.sh, gitignored, chmod 600).
# Ports bind to 127.0.0.1 only: the dev stack is never exposed on the LAN.

services:
  postgres:
    image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env - run scripts/bootstrap.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env - run scripts/bootstrap.sh}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env - run scripts/bootstrap.sh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0@sha256:93a9a7e1908f0c59ffce42ff494791bd785c36de40189759fc2a0ed7d6006c9d
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.16.0@sha256:a1d0a0b439970d74b0a7678dbaaf245d3617865c4e4ec87f1da7673f9658a626
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  es-traces-init:
    # One-shot: installs the traces data-stream index template into Elasticsearch
    # so the collector's exporter can create traces-generic-default. Without it a
    # fresh stack hits index_not_found and drops every span. curl -fS exits
    # non-zero on any HTTP error, so a failed install fails this service and, via
    # service_completed_successfully below, blocks the collector — the ordering
    # that stops `make down -v && make up` from reintroducing that race.
    image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ../otel/traces-index-template.json:/tmp/traces-index-template.json:ro
    command:
      - -fsS
      - -X
      - PUT
      - http://elasticsearch:9200/_index_template/radar-traces
      - -H
      - "Content-Type: application/json"
      - --data-binary
      - "@/tmp/traces-index-template.json"

  es-logs-init:
    # One-shot: installs the per-service logs ILM policy and index template into
    # Elasticsearch, so every radar-<service>-logs-* daily index gets 1 shard, 0
    # replicas and a 7-day retention instead of uncontrolled dynamic-mapping defaults
    # (Phase 13 shard economics). Policy FIRST, then the template that references it
    # by name — the order matters, an index template naming an absent ILM policy is
    # rejected. curl -fsS fails this service on any HTTP error, and
    # service_completed_successfully on fluent-bit below blocks log shipping until the
    # template exists, so the first daily index is created UNDER it rather than with
    # defaults it could never pick up retroactively.
    image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ../fluent-bit/logs-ilm-policy.json:/tmp/logs-ilm-policy.json:ro
      - ../fluent-bit/logs-index-template.json:/tmp/logs-index-template.json:ro
    entrypoint:
      - sh
      - -c
      - >
        curl -fsS -X PUT
        http://elasticsearch:9200/_ilm/policy/radar-logs
        -H 'Content-Type: application/json'
        --data-binary @/tmp/logs-ilm-policy.json &&
        curl -fsS -X PUT
        http://elasticsearch:9200/_index_template/radar-logs
        -H 'Content-Type: application/json'
        --data-binary @/tmp/logs-index-template.json

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.119.0@sha256:36c35cc213c0f3b64d6e8a3e844dc90822f00725e0e518eaed5b08bcc2231e72
    command: ["--config=/etc/otel/collector-config.yaml"]
    # Mounts the single-source-of-truth config; the k8s ConfigMap embeds a
    # byte-identical copy (see deploy/otel/collector-daemonset.yaml).
    volumes:
      - ../otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
    ports:
      # OTLP gRPC (4317) is where host-run RADAR services export spans — matches
      # radar_telemetry.tracing's default localhost:4317. 4318 is OTLP/HTTP.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-traces-init:
        # Traces template must exist before the collector accepts traffic.
        condition: service_completed_successfully
    # No healthcheck: the collector-contrib image is distroless (no shell, wget,
    # or curl) so an in-container probe is impossible. Liveness is proven instead
    # by the DaemonSet's httpGet probe on the health_check extension (13133),
    # which needs no in-container tooling. Nothing in compose depends on this
    # service being healthy — host-run services export best-effort.

  prometheus:
    image: prom/prometheus:v2.55.0@sha256:378f4e03703557d1c6419e6caccf922f96e6d88a530f7431d66a4c4f4b1000fe
    # Mounts the real scrape config + the simulated-shop rules (previously the dev
    # Prometheus ran on its default config with neither). host.docker.internal lets
    # it scrape the host-run RADAR services.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - ../prometheus/radar-service-alerts.yml:/etc/prometheus/radar-service-alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env - run scripts/bootstrap.sh}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env - run scripts/bootstrap.sh}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Provisions the Prometheus datasource + loads the five RADAR dashboards.
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  fluent-bit:
    image: fluent/fluent-bit:3.2.2@sha256:b7a2b9ee1958607da9a16b0efeb24a70a43c5b7e91dbabca4dc02e916aadb914
    # Tails the host-run services' real JSON logs from .dev-run/*.log (mounted at
    # /var/log/radar) and ships them to Elasticsearch as radar-logs-*, the index
    # the logs plugin queries. No healthcheck: the image has no shell/curl — the
    # HTTP health endpoint on 2020 is published for host-side checks, and the real
    # proof is logs landing in ES.
    volumes:
      - ../fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ../../.dev-run:/var/log/radar:ro
      # Dockerised radar-apps log to stdout; the json-file driver writes them here,
      # where Fluent Bit tails them (see fluent-bit.conf). Read-only.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "127.0.0.1:2020:2020"
    depends_on:
      elasticsearch:
        condition: service_healthy
      # Wait for the logs template/ILM so the first daily index is created under it.
      es-logs-init:
        condition: service_completed_successfully

  vault:
    image: hashicorp/vault:1.18.0@sha256:e2da7099950443e234ed699940fabcdc44b5babe33adfb459e189a63b7bb50d7
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?set in .env - run scripts/bootstrap.sh}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
