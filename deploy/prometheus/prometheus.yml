# RADAR Prometheus — compose (dev) scrape + alerting wiring.
#
# Until Phase 10 the dev Prometheus ran on its default config with no rules and no
# scrape targets. This wires it: it scrapes the running RADAR services' /metrics,
# loads the simulated-shop alerting rules, and forwards firing alerts to
# Alertmanager — making the scrape -> fire -> webhook path real rather than declared.
#
# SCOPE: this mounts the EXISTING simulated-shop rules (alerting-rules.yml) only.
# RADAR's OWN service-health alerts (gateway fallback, outbox backlog, agent
# health) land in Phase 10 step 6, not here.
#
# Dev networking: the RADAR services run on the HOST (make dev-apps), so targets
# are host.docker.internal:<port>. Docker Desktop proxies that to the host
# loopback, so it reaches services even though they bind 127.0.0.1. In k8s
# (Phase 12) scraping is via kubernetes_sd instead.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # Two files, kept physically distinct: the simulated-shop rules and RADAR's own
  # service-health rules. Both load; neither is merged into the other.
  - /etc/prometheus/alerting-rules.yml
  - /etc/prometheus/radar-service-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The eight RADAR services, each with a `service` label to group by. Two targets
  # per service: host.docker.internal:809x (native `make dev-apps`) and
  # <service>:8080 (the dockerised radar-apps stack). The unused one shows DOWN.
  - job_name: radar
    static_configs:
      - targets: ["host.docker.internal:8081", "llm-gateway:8080"]
        labels: { service: llm-gateway }
      - targets: ["host.docker.internal:8090", "ingestion:8080"]
        labels: { service: ingestion }
      - targets: ["host.docker.internal:8091", "watcher-agent:8080"]
        labels: { service: watcher-agent }
      - targets: ["host.docker.internal:8092", "planner-agent:8080"]
        labels: { service: planner-agent }
      - targets: ["host.docker.internal:8093", "reasoner-agent:8080"]
        labels: { service: reasoner-agent }
      - targets: ["host.docker.internal:8094", "outbox-worker:8080"]
        labels: { service: outbox-worker }
      - targets: ["host.docker.internal:8095", "knowledge-service:8080"]
        labels: { service: knowledge-service }
      - targets: ["host.docker.internal:8096", "feedback-service:8080"]
        labels: { service: feedback-service }

  # The simulated shop the ecommerce-* rules fire on. Native run on :8099, or
  # platform-sim:8080 in the docker stack; the unused one is DOWN.
  - job_name: platform-sim
    static_configs:
      - targets: ["host.docker.internal:8099", "platform-sim:8080"]
