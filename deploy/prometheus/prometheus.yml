# RADAR Prometheus — compose (dev) scrape + alerting wiring.
#
# Until Phase 10 the dev Prometheus ran on its default config with no rules and no
# scrape targets. This wires it: it scrapes the running RADAR services' /metrics,
# loads the simulated-shop alerting rules, and forwards firing alerts to
# Alertmanager — making the scrape -> fire -> webhook path real rather than declared.
#
# SCOPE: this mounts the EXISTING simulated-shop rules (alerting-rules.yml) only.
# RADAR's OWN service-health alerts (gateway fallback, outbox backlog, agent
# health) land in Phase 10 step 6, not here.
#
# Dev networking: the RADAR services run on the HOST (make dev-apps), so targets
# are host.docker.internal:<port>. Docker Desktop proxies that to the host
# loopback, so it reaches services even though they bind 127.0.0.1. In k8s
# (Phase 12) scraping is via kubernetes_sd instead.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The eight RADAR services. Each carries a `service` label so dashboards and
  # (from step 6) RADAR's own alerts can group by it; `job` stays "radar".
  - job_name: radar
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: { service: llm-gateway }
      - targets: ["host.docker.internal:8090"]
        labels: { service: ingestion }
      - targets: ["host.docker.internal:8091"]
        labels: { service: watcher-agent }
      - targets: ["host.docker.internal:8092"]
        labels: { service: planner-agent }
      - targets: ["host.docker.internal:8093"]
        labels: { service: reasoner-agent }
      - targets: ["host.docker.internal:8094"]
        labels: { service: outbox-worker }
      - targets: ["host.docker.internal:8095"]
        labels: { service: knowledge-service }
      - targets: ["host.docker.internal:8096"]
        labels: { service: feedback-service }

  # The simulated shop whose metrics the ecommerce-* rules fire on. apps/platform-sim
  # is NOT a standing dev service; run it on :8099 to make the shop rules live.
  # Declared here so the target exists the moment it is; DOWN until then.
  - job_name: platform-sim
    static_configs:
      - targets: ["host.docker.internal:8099"]
