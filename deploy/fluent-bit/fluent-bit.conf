# RADAR Fluent Bit — compose (dev) log shipping.
#
# In the dev stack the RADAR services run on the HOST (make dev-apps), each
# writing its JSON stdout to .dev-run/<service>.log. This config tails those real
# service logs — mounted read-only at /var/log/radar — and ships the structured
# lines to Elasticsearch as radar-logs-YYYY.MM.DD, the index the logs plugin
# (plugins/logs/elastic) queries. correlation_id rides on every RADAR log line
# and is the join key that ties logs to traces (ADR 0008).
#
# The k8s equivalent is the DaemonSet in fluent-bit-daemonset.yaml; it tails
# container stdout instead of these files but shares this parser and ES output.

[SERVICE]
    Flush            1
    Log_Level        info
    Parsers_File     parsers.conf
    Daemon           Off
    HTTP_Server      On
    HTTP_Listen      0.0.0.0
    HTTP_Port        2020

[INPUT]
    Name             tail
    Path             /var/log/radar/*.log
    Tag              radar.*
    Parser           radar_json
    Refresh_Interval 5
    Read_from_Head   true

# The .dev-run logs interleave uvicorn's plain-text lines with RADAR's JSON.
# A line the JSON parser cannot read is kept with only a raw `log` field and no
# `service`; this drops exactly those, so only structured RADAR logs ship.
[FILTER]
    Name             grep
    Match            radar.*
    Regex            service .+

[OUTPUT]
    Name               es
    Match              radar.*
    Host               elasticsearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    radar-logs
    Suppress_Type_Name On
    Trace_Error        On
    Retry_Limit        False
