{{- /*
One ServiceAccount per service. This is the identity the vault-init container
authenticates with against Vault's kubernetes auth method (role radar-<service>).

RBAC posture: least privilege. No RADAR service calls the Kubernetes API, so no
Role or RoleBinding is granted — the ServiceAccount exists ONLY as the Vault auth
identity. automountServiceAccountToken stays true because vault-init reads the
projected SA token to log in to Vault; nothing else uses it.
*/ -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "radar.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
automountServiceAccountToken: true
{{- end }}
