{{- /*
One ServiceAccount per service. This is the identity the vault-init container
authenticates with against Vault's kubernetes auth method (role radar-<service>).
RBAC rules (if any) are layered on in a later commit; this only establishes the
per-service identity the Vault roles bind to.
*/ -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "radar.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
