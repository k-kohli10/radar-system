{{- /*
One Deployment per entry in .Values.services. All eight RADAR services share this
template; per-service differences are expressed through values, not extra files.
Vault init-container, resource limits, probes, RBAC, and HPA are layered on in
later commits.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- $svc = $svc | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "radar.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- $hpa := $svc.hpa | default dict }}
  {{- if not $hpa.enabled }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "radar.selectorLabels" (dict "name" $name "root" $) | nindent 6 }}
  template:
    metadata:
      # Full labels on the POD (a superset of the selector), NOT just selectorLabels —
      # Prometheus' kubernetes_sd scrape keys on the pod's app.kubernetes.io/part-of
      # label (see platform-deps prometheus.yaml), which lives in radar.labels. Applying
      # only selectorLabels here left the pods without part-of, so the scrape's keep
      # relabel dropped every app pod and Grafana showed no data. The selector above
      # stays selectorLabels-only (immutable, minimal), and these are a superset of it.
      labels:
        {{- include "radar.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: vault-init
          image: {{ $.Values.vault.image }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/sh", "/vault-init/fetch-secrets.sh", {{ $name | quote }}]
          env:
            - name: VAULT_ADDR
              value: {{ $.Values.vault.addr | quote }}
            - name: RADAR_POSTGRES_HOST
              value: {{ $.Values.vault.postgresHost | quote }}
          volumeMounts:
            - name: vault-init-script
              mountPath: /vault-init
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
      containers:
        - name: {{ $name }}
          image: {{ include "radar.image" (dict "name" $name "root" $) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $k, $v := $.Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := ($svc.env | default dict) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $.Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $.Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources.default) | nindent 12 }}
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
            {{- range $cm := ($svc.configMounts | default list) }}
            - name: config-{{ $cm.key | replace "." "-" }}
              mountPath: {{ $cm.mountPath }}
              subPath: {{ $cm.key }}
              readOnly: true
            {{- end }}
      volumes:
        # In-memory: the sidecar writes secrets here, the app reads them; nothing
        # touches disk.
        - name: vault-secrets
          emptyDir:
            medium: Memory
        - name: vault-init-script
          configMap:
            name: vault-init-script
            defaultMode: 0555
        {{- range $cm := ($svc.configMounts | default list) }}
        - name: config-{{ $cm.key | replace "." "-" }}
          configMap:
            name: {{ $cm.configMap }}
        {{- end }}
{{- end }}
