{{- /*
HorizontalPodAutoscaler for services that opt in via `hpa.enabled`. Only the
externally-driven front doors scale in v1: ingestion (bursty webhook traffic) and
llm-gateway (per-request LLM fan-out). CPU utilisation is a percentage of the pod
CPU request, so requests must be set (they are — see resources). Requires
metrics-server in the cluster.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- $svc = $svc | default dict }}
{{- $hpa := $svc.hpa | default dict }}
{{- if $hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "radar.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $hpa.minReplicas | default 1 }}
  maxReplicas: {{ $hpa.maxReplicas | default 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage | default 75 }}
{{- end }}
{{- end }}
