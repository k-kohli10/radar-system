{{- if .Values.fluentBit.enabled }}
{{- $fb := .Values.fluentBit }}
# Fluent Bit — one per node (DaemonSet), tails container stdout
# (/var/log/containers/*.log), enriches each line with pod metadata via the
# kubernetes filter, and ships the structured RADAR JSON to Elasticsearch as
# radar-logs-YYYY.MM.DD — the index the logs plugin queries. Runs as the image's
# default user: it must read root-owned host log paths, so it is not forced nonroot.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  labels:
    {{- include "platformdeps.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-fluent-bit
  labels:
    {{- include "platformdeps.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
rules:
  # The kubernetes filter reads pod metadata to enrich each log line.
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-fluent-bit
  labels:
    {{- include "platformdeps.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    {{- include "platformdeps.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
data:
  # fluent-bit.conf is k8s-specific (tails container logs); parsers.conf is shared
  # with compose and drift-pinned to deploy/fluent-bit/parsers.conf. Both embedded
  # from chart-local files and pinned in the drift test.
  fluent-bit.conf: |
{{ .Files.Get "files/fluent-bit/fluent-bit.conf" | indent 4 }}
  parsers.conf: |
{{ .Files.Get "files/fluent-bit/parsers.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    {{- include "platformdeps.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: fluent-bit
  template:
    metadata:
      labels:
        {{- include "platformdeps.labels" . | nindent 8 }}
        app.kubernetes.io/component: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      # Ship logs from control-plane / tainted nodes too.
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: {{ $fb.image }}
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $fb.resources | nindent 12 }}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit-config
{{- end }}
