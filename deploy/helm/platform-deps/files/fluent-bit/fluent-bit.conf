[SERVICE]
    Flush            1
    Log_Level        info
    Parsers_File     parsers.conf
    Daemon           Off
    HTTP_Server      On
    HTTP_Listen      0.0.0.0
    HTTP_Port        2020

[INPUT]
    Name             tail
    Path             /var/log/containers/*.log
    multiline.parser cri
    Tag              kube.*
    Refresh_Interval 5
    Read_from_Head   true

# Enrich with pod metadata AND merge the container's JSON log into the record
# root, so `service`, `event`, correlation_id become top-level fields.
[FILTER]
    Name                kubernetes
    Match               kube.*
    Merge_Log           On
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On

# Ship only structured RADAR logs: a line without a `service` field (e.g. a
# runtime's own plain-text line) is dropped rather than indexed as noise.
[FILTER]
    Name             grep
    Match            kube.*
    Regex            service .+

# Derive the per-component index name `radar-<service>-logs` from the merged
# `service` field. Runs after the grep, so `service` is guaranteed present.
[FILTER]
    Name             lua
    Match            kube.*
    call             set_index
    code             function set_index(tag, ts, record) local s = record["service"]; if s == nil then s = "unknown" end; record["es_index_prefix"] = "radar-" .. s .. "-logs"; return 2, ts, record end

# One write per line, to a per-component index: radar-<service>-logs-YYYY.MM.DD.
# Each service's logs are viewable in isolation, and a single Kibana index pattern
# radar-*-logs-* views them all together — no line is written twice. The full
# structured record is shipped, so the stitching fields (correlation_id, service,
# timestamp) are present for reassembling a trace across services.
[OUTPUT]
    Name                es
    Match               kube.*
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     radar-unknown-logs
    Logstash_Prefix_Key $es_index_prefix
    Suppress_Type_Name  On
    Retry_Limit         False
