[SERVICE]
    Flush            1
    Log_Level        info
    Parsers_File     parsers.conf
    Daemon           Off
    HTTP_Server      On
    HTTP_Listen      0.0.0.0
    HTTP_Port        2020

[INPUT]
    Name             tail
    Path             /var/log/containers/*.log
    multiline.parser cri
    Tag              kube.*
    Refresh_Interval 5
    Read_from_Head   true

# Enrich with pod metadata AND merge the container's JSON log into the record
# root, so `service`, `event`, correlation_id become top-level fields.
[FILTER]
    Name                kubernetes
    Match               kube.*
    Merge_Log           On
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On

# Ship only structured RADAR logs: a line without a `service` field (e.g. a
# runtime's own plain-text line) is dropped rather than indexed as noise.
[FILTER]
    Name             grep
    Match            kube.*
    Regex            service .+

[OUTPUT]
    Name               es
    Match              kube.*
    Host               elasticsearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    radar-logs
    Suppress_Type_Name On
    Retry_Limit        False
