# RADAR Grafana dashboards as ConfigMaps (the Phase 10 deliverable).
# Each data value is deploy/grafana/dashboards/<name>.json embedded verbatim;
# the Grafana sidecar loads any ConfigMap labelled grafana_dashboard="1".
# The compose stack provisions the same JSONs from disk (see provisioning/).
# Keep the embedded copy in sync with the file — Phase 11 drift check.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-radar-overview
  namespace: radar-infra
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: radar
data:
  radar-overview.json: |
    {
      "uid": "radar-overview",
      "title": "RADAR \u2014 Overview",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "radar"
      ],
      "timezone": "utc",
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Services up",
          "description": "",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "radar-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "radar-prometheus"
              },
              "expr": "up{job=\"radar\"}",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Request rate (req/s)",
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "radar-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {}
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "radar-prometheus"
              },
              "expr": "sum by (service) (rate(radar_requests_total[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error rate (err/s)",
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "radar-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "radar-prometheus"
              },
              "expr": "sum by (service) (rate(radar_errors_total[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Request p95 (s)",
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "radar-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {}
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "radar-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(radar_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
