[project]
name = "radar-contracts"
version = "0.3.0"
description = "RADAR shared contracts: Pydantic v2 domain schemas and backend Protocol interfaces. Zero vendor dependencies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "mypy==2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_contracts"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
