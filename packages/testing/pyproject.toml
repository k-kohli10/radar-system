[project]
name = "radar-testing"
version = "0.6.0"
description = "Shared pytest fixtures for RADAR suites that need a real Postgres. Test-only support code, consumed as a dev dependency so it never enters a runtime package's import surface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-database",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "sqlalchemy[asyncio]==2.0.51",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_testing"]

[tool.mypy]
strict = true
python_version = "3.14"
