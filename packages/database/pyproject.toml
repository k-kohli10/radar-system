[project]
name = "radar-database"
version = "0.3.0"
description = "RADAR database layer: async SQLAlchemy 2.0 models, transactional outbox writer, idempotency, per-model repositories, and Alembic migrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "radar-contracts",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-common = { workspace = true }
radar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_database"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
