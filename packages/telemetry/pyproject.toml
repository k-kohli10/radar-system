[project]
name = "radar-telemetry"
version = "0.3.0"
description = "RADAR telemetry: Prometheus metric factories, OpenTelemetry tracing with OTLP/gRPC export to Elasticsearch, and span-event helpers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "fastapi==0.141.1",
    "prometheus-client==0.21.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_telemetry"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
