[project]
name = "radar-plugin-sdk"
version = "0.2.0"
description = "RADAR plugin SDK: base classes, protocol-conformance registry, and config-driven backend loader. Zero vendor dependencies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-contracts",
    "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_plugin_sdk"]

[tool.mypy]
strict = true
python_version = "3.14"
# See root pyproject: passing a @runtime_checkable Protocol as a `type[T]`
# registry key is intentional; suppress the type-abstract false positive.
disable_error_code = ["type-abstract"]
