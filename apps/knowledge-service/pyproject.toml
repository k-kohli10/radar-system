[project]
name = "radar-knowledge-service"
version = "0.8.0"
description = "RADAR knowledge service: indexes the runbook corpus and retrieves grounding context for the reasoner. Chunks runbooks on stable section boundaries, embeds them through the llm-gateway (never a provider SDK directly), and serves hybrid retrieval over Elasticsearch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "radar-contracts",
    "radar-database",
    "radar-telemetry",
    "radar-plugin-knowledge-elastic",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.51",
    "httpx==0.28.0",
    "pydantic==2.13.4",
    "prometheus-client==0.21.0",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "mypy==2.1.0",
    "types-pyyaml==6.0.12.20250516",
    "radar-testing",
]

[tool.uv.sources]
radar-common = { workspace = true }
radar-contracts = { workspace = true }
radar-database = { workspace = true }
radar-telemetry = { workspace = true }
radar-plugin-knowledge-elastic = { workspace = true }
radar-testing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_knowledge_service"]

[tool.mypy]
strict = true
python_version = "3.14"
