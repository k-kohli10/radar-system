[project]
name = "radar-planner-agent"
version = "0.7.0"
description = "RADAR planner agent: the second stage of the incident pipeline. Receives incident.plan_requested from the watcher, matches a YAML investigation template on service_name:alert_name (falling back to _default), and transactionally stores the investigation plan while requesting reasoning. No LLM: template matching only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "radar-contracts",
    "radar-database",
    "radar-telemetry",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.0",
    "sqlalchemy[asyncio]==2.0.51",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
    "radar-testing",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.0",
    "mypy==2.1.0",
    "types-pyyaml==6.0.12.20250516",
]

[tool.uv.sources]
radar-testing = { workspace = true }
radar-common = { workspace = true }
radar-contracts = { workspace = true }
radar-database = { workspace = true }
radar-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_planner_agent"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
