[project]
name = "radar-feedback-service"
version = "0.1.0"
description = "RADAR feedback service: the last stage of the incident pipeline. Consumes recommendation.created from the outbox and delivers the RCA card to Slack, then handles interactive feedback (thumbs up/down, resolve) and bot commands. One deployment, one Slack connection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "radar-contracts",
    "radar-database",
    "radar-telemetry",
    "radar-plugin-notifications-slack",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.0",
    "sqlalchemy[asyncio]==2.0.51",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
]

[dependency-groups]
dev = [
    "radar-testing",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-testing = { workspace = true }
radar-common = { workspace = true }
radar-contracts = { workspace = true }
radar-database = { workspace = true }
radar-telemetry = { workspace = true }
radar-plugin-notifications-slack = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_feedback_service"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
