[project]
name = "radar-ingestion"
version = "0.5.0"
description = "RADAR ingestion: the platform entry point. Receives Prometheus, Kibana, and mock alerts on per-source webhook endpoints, normalizes them to the vendor-neutral NormalizedAlert contract, deduplicates by fingerprint within a time window, and transactionally creates incidents while publishing an alert.normalized outbox event. Not an agent: no POST /events, no agent token."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "radar-contracts",
    "radar-database",
    "radar-telemetry",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.0",
    "sqlalchemy[asyncio]==2.0.51",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
]

[dependency-groups]
dev = [
    "radar-testing",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-testing = { workspace = true }
radar-common = { workspace = true }
radar-contracts = { workspace = true }
radar-database = { workspace = true }
radar-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_ingestion"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
