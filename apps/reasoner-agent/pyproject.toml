[project]
name = "radar-reasoner-agent"
version = "0.7.0"
description = "RADAR reasoner agent: the third and final stage of the incident pipeline. Receives incident.reasoning_requested from the planner, builds a context bundle from the incident and plan rows, calls the LLM gateway in extended mode, and stores a root-cause recommendation. Falls back to a template RCA when the LLM is unavailable: an incident is never left without a recommendation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "radar-contracts",
    "radar-database",
    "radar-telemetry",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.0",
    "sqlalchemy[asyncio]==2.0.51",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    # The only agent that calls OUT: the LLM gateway, over HTTP.
    "httpx==0.28.0",
]

[dependency-groups]
dev = [
    "radar-testing",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-testing = { workspace = true }
radar-common = { workspace = true }
radar-contracts = { workspace = true }
radar-database = { workspace = true }
radar-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_reasoner_agent"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
