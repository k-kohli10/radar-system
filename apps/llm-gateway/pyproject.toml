[project]
name = "radar-llm-gateway"
version = "0.4.0"
description = "RADAR LLM Gateway: mode-based routing to LLM providers with token IAM, per-mode limits and timeouts, retry, provider fallback, streaming, and embeddings. No prompt content is ever logged."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "radar-contracts",
    "radar-telemetry",
    "radar-plugin-sdk",
    "radar-plugin-llm-anthropic",
    "radar-plugin-llm-openai",
    "radar-plugin-llm-gemini",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.0",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    "httpx==0.28.0",
    "pyyaml==6.0.2",
    "anthropic==0.40.0",
    "openai==1.55.3",
    "google-generativeai==0.8.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "mypy==2.1.0",
    "types-pyyaml==6.0.12.20250516",
]

[tool.uv.sources]
radar-common = { workspace = true }
radar-contracts = { workspace = true }
radar-telemetry = { workspace = true }
radar-plugin-sdk = { workspace = true }
radar-plugin-llm-anthropic = { workspace = true }
radar-plugin-llm-openai = { workspace = true }
radar-plugin-llm-gemini = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_llm_gateway"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
