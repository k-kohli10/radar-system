[project]
name = "radar-platform-sim"
version = "0.5.0"
description = "RADAR platform-sim: a local-only, single-process simulator of a multi-service e-commerce platform. Exposes per-service domain metrics and chaos endpoints so Prometheus can fire realistic alerts at RADAR ingestion. Never deployed to Kubernetes; not a RADAR agent (no Postgres, outbox, /events, /readyz, or agent token)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "radar-common",
    "radar-telemetry",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.13.4",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
]

[tool.uv.sources]
radar-common = { workspace = true }
radar-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_platform_sim"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
