name: build

# Path-gated multi-arch image builds + boot-smoke. Detect turns changed files into
# the exact services to build; a deploy/- or docs-only change builds nothing. No
# push — publishing to GHCR happens in deploy.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed services
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # New branch / unknown base: diff against the empty tree so every service builds.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "changed files:"; echo "$changed"
          services="$(printf '%s\n' "$changed" | python3 scripts/detect-changed-services.py)"
          echo "services to build: $services"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.service }} (amd64 + arm64)
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    # Mapped through env: the workflow parser rejects secrets.* in a step `if:`.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Raises the Docker Hub pull rate limit; skipped on forks (no secrets).
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Prove both arches compile. Multi-platform can't load into the daemon, so no
      # --load/--push here; tagged by SHA to match the scheme deploy.yml publishes.
      - name: Build multi-arch (amd64 + arm64), tagged by SHA, no push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "apps/${{ matrix.service }}/Dockerfile" \
            --tag "radar-${{ matrix.service }}:${{ github.sha }}" \
            .

      # Boot-smoke needs a runnable image: rebuild the native arch with --load.
      - name: Build native image for boot-smoke (loadable)
        run: |
          docker buildx build \
            --platform linux/amd64 --load \
            --file "apps/${{ matrix.service }}/Dockerfile" \
            --tag "radar-${{ matrix.service }}:smoke" \
            .

      # Proves the image STARTS and serves /healthz (catches entrypoint / missing-dep
      # bugs buildx alone ships green). Not a backend-load check — /readyz needs secrets.
      - name: Boot-smoke — container starts and serves /healthz
        run: |
          set -euo pipefail
          svc="${{ matrix.service }}"
          docker run -d --name "smoke-$svc" -p 18080:8080 "radar-$svc:smoke"
          code=000
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
              http://127.0.0.1:18080/healthz || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "BOOT-SMOKE FAILED for $svc: /healthz=$code"
            docker logs "smoke-$svc" || true
            exit 1
          fi
          echo "BOOT-SMOKE OK for $svc: starts and serves /healthz"

      - name: Clean up smoke container
        if: always()
        run: docker rm -f "smoke-${{ matrix.service }}" 2>/dev/null || true
