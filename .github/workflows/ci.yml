name: ci

# Lint, typecheck, full test suite, and offline Helm-chart validation.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.26"
  UV_PYTHON: "3.14"
  HELM_VERSION: "v4.2.4"
  KUBECONFORM_VERSION: "v0.8.0"

jobs:
  lint:
    name: lint + typecheck (ruff, mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install "${UV_PYTHON}"
      - run: uv sync --frozen --all-packages
      - run: make lint

  test:
    name: test (full suite + no-silent-skip guard)
    runs-on: ubuntu-latest
    # Mapped through env: the workflow parser rejects secrets.* in a step `if:`.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install "${UV_PYTHON}"
      - run: uv sync --frozen --all-packages

      # The compose file interpolates ${VAR:?} for every service at load time, so
      # all must be defined even though CI starts only the Postgres/ES/otel subset.
      - name: Write CI .env for the compose stack
        run: |
          cat > .env <<'ENV'
          POSTGRES_USER=radar
          POSTGRES_PASSWORD=radar
          POSTGRES_DB=radar
          POSTGRES_DSN=postgresql+asyncpg://radar:radar@localhost:5432/radar
          VAULT_DEV_ROOT_TOKEN=ci-placeholder-unused
          GRAFANA_ADMIN_USER=ci-placeholder-unused
          GRAFANA_ADMIN_PASSWORD=ci-placeholder-unused
          ENV

      # Authenticated pulls use the higher Docker Hub rate limit (shared runners hit
      # the anonymous per-IP limit). Skipped on forks, where secrets are absent.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Isolated + retried so a transient Docker Hub throttle retries just this step.
      - name: Pre-pull infra images (retry on Docker Hub throttling)
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            docker compose -f deploy/compose/docker-compose-infra.yml --env-file .env \
              pull postgres elasticsearch otel-collector && exit 0
            echo "infra image pull attempt $i failed; retrying in $((i*20))s"
            sleep $((i*20))
          done
          echo "infra image pull failed after 3 attempts"; exit 1

      - name: Start infra (postgres, elasticsearch, otel-collector)
        run: >
          docker compose -f deploy/compose/docker-compose-infra.yml --env-file .env
          up -d --wait postgres otel-collector

      - name: Run tests
        run: uv run pytest -m 'not live' --junitxml=junit.xml

      # pytest exits 0 on SKIP, so failed infra would go green-with-skips. This
      # fails the run if any load-bearing infra/DB proof did not actually run.
      - name: Assert required infra/DB proofs ran (no silent skip)
        run: uv run python scripts/assert-required-tests-ran.py junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml

      - name: Tear down infra
        if: always()
        run: >
          docker compose -f deploy/compose/docker-compose-infra.yml --env-file .env
          down -v

  helm:
    name: helm lint + template + kubeconform (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate charts
        run: make helm-validate
