[project]
name = "radar-system"
version = "0.1.0"
description = "RADAR - Real-time Anomaly Detection and Automated Response. AI-powered Incident Intelligence Platform for SRE workflows."
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pre-commit==4.0.1",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.15.20",
    "mypy==2.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*",
    "plugins/*/*",
]

[tool.ruff]
line-length = 88
target-version = "py314"
# Alembic scaffolding (env.py + autogenerated versions/) is boilerplate/generated.
extend-exclude = ["packages/database/src/radar_database/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.14"
# pydantic-settings sources fields from the environment / Vault files at
# runtime, so `Settings()` is valid with no args; the plugin teaches mypy this
# (and sharpens Pydantic model checking generally).
plugins = ["pydantic.mypy"]
# `type-abstract` is a false positive for the plugin registry: passing a
# @runtime_checkable Protocol class as a `type[T]` key is intentional and never
# instantiates the Protocol. Suppressed repo-wide so callers stay strict-clean.
disable_error_code = ["type-abstract"]
# Alembic env.py and autogenerated migrations use Alembic's dynamically-typed
# context/op API and are excluded from strict type checking. The per-package
# `tests/conftest.py` files all map to the same top-level module `conftest`,
# which `mypy .` rejects as a duplicate; they are excluded from the aggregate
# run (per-package `mypy packages/<pkg>` still type-checks them).
exclude = [
    "packages/database/src/radar_database/migrations/",
    "tests/conftest\\.py$",
]

# google-generativeai ships no py.typed marker (google.api_core, by contrast,
# is typed and stays strictly checked). grpcio's stubs are a separate package
# (types-grpcio) we don't need — only the gateway tests import grpc, to build
# enum-coded exceptions.
[[tool.mypy.overrides]]
module = ["google", "google.generativeai", "google.generativeai.*", "grpc", "grpc.*"]
ignore_missing_imports = true

# google.api_core's exception constructors are untyped; the gateway tests
# construct them to drive the Gemini translator. Production code never does.
[[tool.mypy.overrides]]
module = ["test_gateway_providers"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "packages", "apps"]
