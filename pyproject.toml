[project]
name = "radar-system"
version = "0.1.0"
description = "RADAR - Real-time Anomaly Detection and Automated Response. AI-powered Incident Intelligence Platform for SRE workflows."
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pre-commit==4.0.1",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.15.20",
    "mypy==2.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*",
    "plugins/*/*",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
